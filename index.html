<style>
/* Layout: fixed left navigation + wide work area; tables for records, modal forms for entry; paper-white A5 documents for receipts/reports */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --ink:#142038; --muted:#58667f; --line:#dbe2ee;
  --accent:#2447a6; --accent-ink:#ffffff; --accent-soft:#e5ecfb;

  --f-body:'Inter','Noto Sans Khmer','Khmer OS Battambang','Leelawadee UI',system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1222; --surface:#141c31; --ink:#e7ecf8; --muted:#97a3bd; --line:#26314d;
  --accent:#7d9bf0; --accent-ink:#0c1222; --accent-soft:#1c2a52;
  --input:#2a2713; --calc:#1b243b;
  --good:#58c88e; --good-soft:#12301f; --warn:#f0b35a; --warn-soft:#38290f; --bad:#f08a82; --bad-soft:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1222; --surface:#141c31; --ink:#e7ecf8; --muted:#97a3bd; --line:#26314d;
  --accent:#7d9bf0; --accent-ink:#0c1222; --accent-soft:#1c2a52;
  --input:#2a2713; --calc:#1b243b;
  --good:#58c88e; --good-soft:#12301f; --warn:#f0b35a; --warn-soft:#38290f; --bad:#f08a82; --bad-soft:#3a1714; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:4px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{display:block;font-family:var(--f-head);font-size:17px;color:var(--accent)}
.brand span{font-size:12px;color:var(--muted)}
.nav a{display:block;padding:8px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--calc)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav h4{margin:14px 12px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.main{padding:20px max(16px,env(safe-area-inset-right,0px)) 60px 24px;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:22px;flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:500}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile small{color:var(--muted);display:block}
.tile b{font-size:24px;font-variant-numeric:tabular-nums;display:block;line-height:1.3}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)} .tile.good b{color:var(--good)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--accent);color:var(--accent-ink);text-align:left;padding:8px 10px;font-weight:600;font-size:13px;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--calc)}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--calc);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input,.bar select,.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.bar input[type=search]{flex:1;min-width:180px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.f label.wide{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;background:var(--input);color:var(--ink);font-weight:400;font-size:14px}
.f input[readonly],.f .calc{background:var(--calc)}
.calcbox{background:var(--calc);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 14px;margin-top:6px}
.calcbox small{color:var(--muted);display:block;font-size:12px} .calcbox b{font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal{background:var(--surface);border-radius:14px;width:min(860px,100%);padding:20px;border:1px solid var(--line);margin:auto}
.modal.wide{width:min(1000px,100%)}
.modal h2{font-size:19px;margin-bottom:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.err{background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:8px;margin-top:10px;font-weight:600}
.note{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.hint{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:90;font-weight:600;max-width:90vw}
.sec{margin:20px 0 8px;font-size:16px}
.chart{width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.menu-btn{display:none}
.photo{width:96px;height:128px;border:1px dashed var(--line);border-radius:8px;background:var(--calc);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.welcome{max-width:640px;margin:8vh auto;text-align:center}
.welcome h1{font-size:26px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.kv span:nth-child(odd){color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}

.hero{position:relative;overflow:hidden;border-radius:20px;padding:24px 26px;color:#fff;background:linear-gradient(135deg,#1d3b94 0%,#2f6fd6 55%,#18a58a 120%);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,l=2)=>String(n).padStart(l,'0');
const round2=n=>Math.round((+n||0)*100+ (n<0?-1e-9:1e-9))/100;
const sum=(a,f)=>round2(a.reduce((t,x)=>t+(+f(x)||0),0));
const money=n=>'$'+(round2(n)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>round2(n).toLocaleString('en-US',{maximumFractionDigits:2});
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function addMonths(s,n){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return iso(t)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)}

const age=s=>{if(!s)return'';const d=parseD(s),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a+' ឆ្នាំ'};

/* ====================== caches / derived data ====================== */
function bump(){ver++}
let cacheVer=-1,C={};
function cache(){
  if(cacheVer===ver)return C;cacheVer=ver;
  const byId=new Map(S.students.map(s=>[s.id,s]));
  const pBy=new Map();
  const sorted=[...S.payments].sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
  for(const p of sorted){if(!pBy.has(p.sid))pBy.set(p.sid,[]);pBy.get(p.sid).push(p)}
  const setl=new Map();
  for(const p of sorted)if(p.pack===SETTLE&&p.settles){if(!setl.has(p.settles))setl.set(p.settles,[]);setl.get(p.settles).push(p)}
  const pById=new Map(S.payments.map(p=>[p.id,p]));
  // per-payment derived
  const der=new Map();
  for(const [sid,list] of pBy){
    let m=0,first=true;const st=byId.get(sid);
    for(const p of list){
      if(p.pack===SETTLE){der.set(p.id,{kind:'សងបំណុល'});continue}
      const start=st&&st.reg?addMonths(st.reg,m):'';const end=start?addDays(addMonths(start,p.months),-1):'';
      const kind=st&&st.status==='ឈប់រៀន'?'សិស្សឈប់រៀន':first?'សិស្សថ្មី':'សិស្សចាស់';
      const paidSet=(setl.get(p.id)||[]).reduce((t,x)=>t+x.paidAmt,0);
      der.set(p.id,{start,end,kind,remaining:round2(p.due-p.paidAmt-paidSet)});
      m+=p.months;first=false;
    }
  }
  for(const [orig,list] of setl){const o=pById.get(orig);let run=o?o.due-o.paidAmt:0;for(const s of list){run=round2(run-s.paidAmt);der.get(s.id).after=run}}
  const sold=new Map();for(const s of S.sales)for(const l of s.lines)sold.set(l.code,(sold.get(l.code)||0)+(+l.qty||0));
  const mv=new Map();for(const x of S.moves){const k=x.code;if(!mv.has(k))mv.set(k,[0,0,0,0,0,0,0]);mv.get(k)[MOVES.indexOf(x.type)]+=+x.qty||0}
  C={byId,pBy,setl,pById,der,sold,mv,itemById:new Map(S.items.map(i=>[i.code,i]))};
  return C;
}
function feeFor(level){const f=S.settings.fees.find(x=>x.level===level);return f?f.fee:0}
function calcPay(level,pack,dtype,dval,paidIn){
  const pk=S.settings.packages.find(x=>x.name===pack);const months=pk?pk.months:0;const fee=feeFor(level);
  const gross=round2(months*fee);let disc=0;
  if(dtype==='ភាគរយ')disc=gross*(+dval||0)/100;else if(dtype==='សាច់ប្រាក់')disc=+dval||0;
  disc=round2(Math.min(gross,Math.max(0,disc)));const due=round2(gross-disc);
  const paidAmt=(paidIn===''||paidIn==null)?due:round2(+paidIn);
  return{months,fee,gross,disc,due,paidAmt};
}
function sInfo(s){
  const c=cache();const ps=c.pBy.get(s.id)||[];const reg=ps.filter(p=>p.pack!==SETTLE);
  const due=sum(reg,p=>p.due),paid=sum(ps,p=>p.paidAmt),months=sum(reg,p=>p.months),owe=round2(due-paid);
  const through=months&&s.reg?addDays(addMonths(s.reg,months),-1):'';
  let st;
  if(s.status==='ឈប់រៀន')st=owe>0?'ឈប់រៀន (នៅជំពាក់)':'ឈប់រៀន';
  else if(!months)st='មិនទាន់បង់';
  else if(owe>0)st='នៅជំពាក់';
  else if(through&&through<today())st='ត្រូវបន្តបង់';
  else st='បង់គ្រប់';
  return{due,paid,months,owe,through,st,last:ps.length?ps[ps.length-1].date:''};
}
const stPill=st=>({'បង់គ្រប់':'good','នៅជំពាក់':'bad','ឈប់រៀន (នៅជំពាក់)':'bad','ត្រូវបន្តបង់':'warn','មិនទាន់បង់':'warn','ឈប់រៀន':''}[st]??'');
function itemStock(it){
  const c=cache();const m=c.mv.get(it.code)||[0,0,0,0,0,0,0];const sold=c.sold.get(it.code)||0;
  const left=(+it.open||0)+m[0]+m[1]-sold-m[2]-m[3]-m[4]+m[5]-m[6];
  const st=left<0?'ស្តុកអវិជ្ជមាន':left===0?'អស់ស្តុក':left<=(+it.low||0)?'ជិតអស់':'មាន';
  return{sold,left,st,value:round2(Math.max(0,left)*(+it.price||0)),m};
}
const stockPill=st=>({'មាន':'good','ជិតអស់':'warn','អស់ស្តុក':'bad','ស្តុកអវិជ្ជមាន':'bad'}[st]);
function saleCalc(sale){
  let gross=0,disc=0;
  const lines=sale.lines.map(l=>{
    const g=round2((+l.qty||0)*(+l.price||0));let d=0;
    if(l.dtype==='ភាគរយ')d=g*(+l.dval||0)/100;else if(l.dtype==='សាច់ប្រាក់')d=+l.dval||0;
    d=round2(Math.min(g,Math.max(0,d)));gross+=g;disc+=d;
    const it=cache().itemById.get(l.code);
    return{...l,gross:g,disc:d,net:round2(g-d),name:it?(it.name+(it.unit?', '+it.unit:'')):l.code,cat:it?it.cat:''};
  });
  const net=round2(gross-disc);const paid=sale.paidAmt==null||sale.paidAmt===''?net:+sale.paidAmt;
  return{lines,gross:round2(gross),disc:round2(disc),net,paid:round2(paid),left:round2(net-paid)};
}
function buyerName(s){if(s.sid){const st=cache().byId.get(s.sid);return st?st.name:s.sid}return s.other||''}
const progByName=n=>S.settings.programs.find(p=>p.kh===n);
const shiftEn=k=>{const s=S.settings.shifts.find(x=>x.kh===k);return s?s.en:k};
function nextId(coll,prefix,len){let m=0;for(const r of S[coll]){const n=parseInt(String(r.id).replace(/\D/g,''),10);if(n>m)m=n}const vk={payments:'payment',sales:'sale'}[coll];if(vk)for(const v of S.voids||[])if(v.kind===vk){const n=parseInt(String(v.recId).replace(/\D/g,''),10);if(n>m)m=n}return prefix+pad(m+1,len)}
function nextReceipt(date){
  const y=date.slice(0,4);let m=0;
  for(const p of S.payments)if(p.date.slice(0,4)===y){const n=parseInt(p.receipt,10);if(n>m)m=n}
  for(const v of S.voids||[])if(v.kind==='payment'&&v.rec.date.slice(0,4)===y){const n=parseInt(v.rec.receipt,10);if(n>m)m=n}
  return pad(m+1,6);
}

/* ---- PDF / HTML export of paper documents ---- */
async function exportPdf(html,{land,filename}){
  if(!window.html2canvas||!window.jspdf){toast('មិនទាន់ផ្ទុកឧបករណ៍ PDF');return}
  const off=$('#offscreen');off.innerHTML=html;const el=off.firstElementChild;
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await html2canvas(el,{scale:2.5,backgroundColor:'#ffffff',useCORS:true});
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:land?'landscape':'portrait',unit:'mm',format:'a5'});
    const W=land?210:148,H=land?148:210;
    const pxPerMm=cv.width/W;const pageH=Math.floor(H*pxPerMm);
    let y=0,first=true;
    while(y<cv.height-2){
      const h=Math.min(pageH,cv.height-y);const sl=document.createElement('canvas');sl.width=cv.width;sl.height=h;
      const g=sl.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sl.width,h);g.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(!first)doc.addPage();doc.addImage(sl.toDataURL('image/jpeg',.92),'JPEG',0,0,W,h/pxPerMm);
      y+=pageH;first=false;
    }
    await dl(filename,doc.output('arraybuffer'));
  }catch(e){console.error(e);toast('បង្កើត PDF មិនបាន')}
  finally{off.innerHTML=''}
}
function exportHtml(html,{land,filename}){
  const page=`<!doctype html><html lang="km"><head><meta charset="utf-8"><title>${esc(filename)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&family=Inter:wght@400;600&display=swap"><style>@page{size:A5 ${land?'landscape':'portrait'};margin:0}body{margin:0;background:#ddd}${DOC_CSS}@media print{body{background:#fff}.doc{box-shadow:none!important;margin:0!important}}.doc{margin:10px auto;box-shadow:0 0 6px #0004}</style></head><body>${html}<p style="text-align:center;font:13px sans-serif;color:#555" class="noprint">ចុច Ctrl+P ដើម្បីព្រីន (ជ្រើស A5 · Margins: None)</p><style>@media print{.noprint{display:none}}</style></body></html>`;
  return dl(filename,page);
}
function docModal(title,html,{land,name}){
  const ov=modal(`<h2>${esc(title)}</h2><div class="previewbox">${html}</div>
  <p class="hint">PDF ទំហំ A5 ${land?'(ផ្ដេក)':'(បញ្ឈរ)'} · ឬទាញយកជា HTML រួចចុច Ctrl+P ដើម្បីព្រីនដោយផ្ទាល់។</p>
  <div class="mfoot"><button class="btn" id="dh">ទាញយក HTML (ព្រីន)</button><button class="btn pri" id="dp">ទាញយក PDF</button><button class="btn" id="dc">បិទ</button></div>`,{wide:true});
  $('#dc',ov).onclick=()=>ov.close();
  $('#dp',ov).onclick=e=>{e.target.disabled=true;exportPdf(html,{land,filename:name+'.pdf'}).finally(()=>e.target.disabled=false)};
  $('#dh',ov).onclick=()=>exportHtml(html,{land,filename:name+'.html'});
}

const TYPE_EN={'សិស្សថ្មី':'New','សិស្សចាស់':'Old','សងបំណុល':'Settlement','សិស្សឈប់រៀន':'Dropped'};
function schoolHead(titleKh,titleEn,noText){
  const inf=S.settings.info,lg=S.settings.logo;
  const init=(inf.nameEn||'ALE').split(' ').map(w=>w[0]).join('').slice(0,3);
  return `<div class="rc-head"><div class="rc-logo">${lg?`<img src="${lg}" alt="">`:esc(init)}</div>
  <div class="rc-sch"><b>${esc(inf.nameKh)}</b><b>${esc(inf.nameEn)}</b><span>${esc(inf.nameEn2)}</span>
  ${inf.addr||inf.contact?`<small>${esc(inf.addr)}${inf.addr&&inf.contact?' · ':''}${esc(inf.contact)}</small>`:''}</div>
  <div class="rc-ttl"><b>${titleKh}</b><b>${titleEn}</b>${noText?`<span class="no">${esc(noText)}</span>`:''}</div></div>`;
}
function receiptDoc(p,sale){
  const c=cache(),inf=S.settings.info;
  const sid=p?p.sid:sale.sid;const s=sid?c.byId.get(sid):null;
  const d=p?c.der.get(p.id):null;const sc=sale?saleCalc(sale):null;const settle=p&&p.pack===SETTLE;
  const rows=[];
  if(p){
    const dt=p.dtype==='ភាគរយ'?(p.dval||0)+'%':p.dtype==='សាច់ប្រាក់'?money(p.dval):'';
    rows.push([settle?'- Settlement':'- Tuition Fee',settle?'- សងបំណុលវិក្កយបត្រ '+p.settles:'- '+(s?s.level:''),settle?'':p.months+' month',settle?'':money(p.fee),settle?'':(p.disc?dt:''),settle?p.paidAmt:p.due,settle?'':fd(d.start),settle?'':fd(d.end)]);
  }
  if(sc)for(const l of sc.lines){
    const dt=l.dtype==='ភាគរយ'?(l.dval||0)+'%':l.dtype==='សាច់ប្រាក់'?money(l.dval):'';
    rows.push(['- '+l.cat,'- '+l.name,l.qty+' pcs',money(l.price),l.disc?dt:'',l.net,'','']);
  }
  const sub=round2((p?(settle?p.paidAmt:p.due):0)+(sc?sc.net:0));
  const vat=round2(sub*(inf.vat||0)/100),grand=round2(sub+vat);
  const paid=round2((p?p.paidAmt:0)+(sc?sc.paid:0));
  const settledAfter=p&&!settle?sum(c.setl.get(p.id)||[],x=>x.paidAmt):0;
  const dueAmt=settle?round2((d.after||0)+grand-paid):round2(grand-paid-settledAfter);
  const date=p?p.date:sale.date;
  const method=p?p.method:sale.method;
  const typ=p?d.kind:'';
  let note='';
  if(settle){const o=c.pById.get(p.settles);note='សងវិក្កយបត្រលេខ '+(o?o.receipt:p.settles)+(o?' ថ្ងៃ '+fd(o.date):'')}
  else if(p&&p.dwhy)note='បញ្ចុះតម្លៃ៖ '+p.dwhy;
  const extra=[note,p&&p.note,sale&&sale.note].filter(Boolean).join(' · ');
  const noText=p?'N°: '+p.receipt:'N°: '+sale.id;
  const prog=s?progByName(s.prog):null;
  return `<div class="doc land rc">${schoolHead('បង្កាន់ដៃទទួលប្រាក់','OFFICIAL RECEIPT',noText)}
  <div class="rc-info">
   <div><span>Student Name:</span><b>${esc(s?s.name:(sale?sale.other:''))}</b></div><div><span>Sex:</span><b>${s?(s.sex==='ប្រុស'?'Male':s.sex==='ស្រី'?'Female':''):''}</b></div><div><span>Program:</span><b>${esc(prog?prog.en:'')}</b></div>
   <div><span>Student ID:</span><b>${esc(sid||'')}</b></div><div><span>Type:</span><b>${esc(TYPE_EN[typ]||'')}</b></div><div><span>Grade:</span><b>${esc(s?s.level:'')}</b></div>
   <div><span>Contact:</span><b>${esc(s?s.phone:'')}</b></div><div><span>Time:</span><b>${esc(s?shiftEn(s.shift):'')}</b></div><div><span>Room:</span><b>${esc(s?s.room:'')}</b></div>
   <div><span>Payment:</span><b>${esc(method||'')}</b></div><div></div><div><span>Invoice No:</span><b>${esc((p?p.id:'')+(p&&sale?' + ':'')+(sale?sale.id:''))}</b></div>
   <div></div><div></div><div><span>Invoice Date:</span><b>${fd(date)}</b></div>
  </div>
  <table><thead><tr><th>ល.រ</th><th>ប្រភេទ Fee Type</th><th>បរិយាយ Description</th><th>ចំនួន Qty</th><th class="r">តម្លៃឯកតា Unit</th><th>បញ្ចុះ Disc.</th><th class="r">ទឹកប្រាក់ Amount</th><th>ចាប់ផ្តើម Start</th><th>ផុត End</th></tr></thead>
  <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="r">${esc(r[3])}</td><td>${esc(r[4])}</td><td class="r">${money(r[5])}</td><td>${r[6]}</td><td>${r[7]}</td></tr>`).join('')}</tbody></table>
  <div class="rc-bot"><div class="rc-notes">*បញ្ជាក់:\n${esc(inf.n1)}\n${esc(inf.n2)}\n${esc(inf.n3)}${extra?`\n<b>ចំណាំ: ${esc(extra)}</b>`:''}</div>
   <div class="rc-tot"><div><span>សរុប/Sub-Total</span><span>${money(sub)}</span></div><div><span>VAT (${inf.vat||0}%)</span><span>${money(vat)}</span></div>
   <div class="g"><span>សរុបរួម/Grand Total</span><span>${money(grand)}</span></div><div><span>ទឹកប្រាក់បានបង់/Paid</span><span>${money(paid)}</span></div>
   <div class="d"><span>ទឹកប្រាក់ជំពាក់/Due</span><span>${money(dueAmt)}</span></div>
   <div><span>ប្រាក់រៀល/Riel</span><span>${num(paid*inf.rate)} ៛</span></div><div style="font-size:9px;color:#555"><span>Exchange Rate</span><span>1$ = ${num(inf.rate)}៛</span></div></div></div>
  <div class="rc-sign"><span>ហត្ថលេខានិងឈ្មោះបេឡាករ/Cashier's Signature and Name${(p&&p.byName)||(sale&&sale.byName)?': '+esc((p&&p.byName)||sale.byName):''}</span><span>Printed: ${fd(today())}</span></div></div>`;
}

function repData(from,to){
  const c=cache();const inR=d=>d>=from&&d<=to;
  const mine=ME.role==='clerk'&&STORE==='db';const pays=S.payments.filter(p=>inR(p.date)&&(!mine||p.by===ME.id)),reg=pays.filter(p=>p.pack!==SETTLE),setl=pays.filter(p=>p.pack===SETTLE);
  const sales=S.sales.filter(s=>inR(s.date)&&(!mine||s.by===ME.id)).map(s=>({s,c:saleCalc(s)}));
  const R={from,to,pays,reg,setl,sales};
  R.voids=S.voids.filter(v=>inR(v.date)&&(!mine||(v.rec&&v.rec.by===ME.id)));
  R.tu={n:reg.length,ns:setl.length,gross:sum(reg,p=>p.gross),disc:sum(reg,p=>p.disc),due:sum(reg,p=>p.due),paid:sum(pays,p=>p.paidAmt),left:sum(reg,p=>c.der.get(p.id).remaining)};
  R.sa={n:sales.length,qty:sum(sales,x=>x.c.lines.reduce((t,l)=>t+(+l.qty||0),0)),gross:sum(sales,x=>x.c.gross),disc:sum(sales,x=>x.c.disc),due:sum(sales,x=>x.c.net),paid:sum(sales,x=>x.c.paid),left:sum(sales,x=>x.c.left)};
  R.income=round2(R.tu.paid+R.sa.paid);
  const mvs=S.moves.filter(m=>inR(m.date));
  R.stockCost=sum(mvs.filter(m=>m.type===MOVES[0]),m=>(+m.qty||0)*(+m.cost||0));
  R.mvs=mvs;
  R.byMethod=METHODS.map(m=>({m,t:sum(pays.filter(p=>p.method===m),p=>p.paidAmt),s:sum(sales.filter(x=>x.s.method===m),x=>x.c.paid)}));
  R.byProg=S.settings.programs.map(pr=>{const l=pays.filter(p=>{const st=c.byId.get(p.sid);return st&&st.prog===pr.kh});const r2=l.filter(p=>p.pack!==SETTLE);return{n:pr.kh,cnt:r2.length,due:sum(r2,p=>p.due),paid:sum(l,p=>p.paidAmt)}});
  R.byPack=S.settings.packages.map(pk=>{const l=pays.filter(p=>p.pack===pk.name);return{n:pk.name,cnt:l.length,paid:sum(l,p=>p.paidAmt),disc:sum(l,p=>p.disc)}});
  R.stu={reg:S.students.filter(s=>s.reg&&inR(s.reg)).length,first:reg.filter(p=>c.der.get(p.id).kind==='សិស្សថ្មី').length,renew:reg.filter(p=>c.der.get(p.id).kind==='សិស្សចាស់').length,drop:S.students.filter(s=>s.status==='ឈប់រៀន'&&s.dropDate&&inR(s.dropDate)).length};
  R.mvT=MOVES.map(t=>{const l=mvs.filter(m=>m.type===t);return{t,n:l.length,q:sum(l,m=>m.qty),v:sum(l,m=>(+m.qty||0)*(+m.cost||0))}});
  const sl=S.sales.filter(s=>inR(s.date)&&(!mine||s.by===ME.id));R.mvT.push({t:'លក់ (តាមវិក្កយបត្រលក់)',n:sl.length,q:sum(sl,s=>s.lines.reduce((t,l)=>t+(+l.qty||0),0)),v:sum(sales,x=>x.c.net)});
  return R;
}
function repDoc(mode,from,to,title){
  const R=repData(from,to);const c=cache();
  const row=(a,b,cls)=>`<tr${cls?` class="${cls}"`:''}><td>${a}</td><td class="r">${b}</td></tr>`;
  let h=`<div class="doc port">${schoolHead('របាយការណ៍','REPORT','')}<h3>${esc(title)}</h3><div class="sub">${fd(from)}${from!==to?' – '+fd(to):''}</div>
  <h4>១. ថ្លៃសិក្សា (Tuition)</h4><table>${row('ចំនួនវិក្កយបត្របង់ប្រាក់ / ការសង',R.tu.n+' / '+R.tu.ns)}${row('ថ្លៃមុនបញ្ចុះ',money(R.tu.gross))}${row('ការបញ្ចុះតម្លៃ',money(R.tu.disc))}${row('ត្រូវបង់ក្រោយបញ្ចុះ',money(R.tu.due))}${row('បានបង់',money(R.tu.paid))}${row('នៅសល់ (ជំពាក់)',money(R.tu.left))}</table>
  <h4>២. លក់ឯកសណ្ឋាន និងសម្ភារៈ</h4><table>${row('ចំនួនវិក្កយបត្រលក់',R.sa.n)}${row('ចំនួនទំនិញ (ឯកតា)',num(R.sa.qty))}${row('ថ្លៃមុនបញ្ចុះ',money(R.sa.gross))}${row('ការបញ្ចុះតម្លៃ',money(R.sa.disc))}${row('ត្រូវបង់ក្រោយបញ្ចុះ',money(R.sa.due))}${row('បានបង់',money(R.sa.paid))}${row('នៅសល់ (ជំពាក់)',money(R.sa.left))}</table>

  <h4>៧. សិស្ស</h4><table>${row('ចុះឈ្មោះថ្មី',R.stu.reg)}${row('បង់ប្រាក់លើកដំបូង (សិស្សថ្មី)',R.stu.first)}${row('បង់ប្រាក់បន្ត (សិស្សចាស់)',R.stu.renew)}${row('ឈប់រៀន',R.stu.drop)}</table>
  <h4>៨. ចលនាស្តុក</h4><table><tr><th>ប្រភេទ</th><th class="r">ដង</th><th class="r">ចំនួន</th><th class="r">តម្លៃ</th></tr>${R.mvT.map(x=>`<tr><td>${x.t}</td><td class="r">${x.n}</td><td class="r">${num(x.q)}</td><td class="r">${money(x.v)}</td></tr>`).join('')}</table>`;
  if(mode==='day'){
    h+=`<h4>៩. បញ្ជីបង្កាន់ដៃ</h4><table><tr><th>បង្កាន់ដៃ</th><th>សិស្ស</th><th>កញ្ចប់</th><th class="r">បានបង់</th><th>វិធី</th></tr>${R.pays.map(p=>{const st=c.byId.get(p.sid);return`<tr><td>${p.receipt} (${p.id})</td><td>${esc(st?st.name:p.sid)}</td><td>${esc(p.pack)}</td><td class="r">${money(p.paidAmt)}</td><td>${esc(p.method)}</td></tr>`}).join('')||'<tr><td colspan="5">គ្មាន</td></tr>'}</table>

function parseCsv(t){t=t.replace(/^\ufeff/,'');const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
function normDate(x){x=clean(x);if(!x)return'';let m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);return null}

    });
    $('#res',ov).innerHTML=`<div class="calcbox"><div><small>ត្រឹមត្រូវ</small><b style="color:var(--good)">${good.length}</b></div><div><small>មានកំហុស (នឹងរំលង)</small><b style="color:var(--bad)">${bad.length}</b></div></div>${bad.length?`<div class="err" style="max-height:160px;overflow:auto;font-weight:400">${bad.slice(0,40).join('<br>')}${bad.length>40?'<br>…':''}</div>`:''}${good.length?`<div class="mfoot"><button class="btn pri" id="doimp">នាំចូល ${good.length} សិស្ស</button></div>`:''}`;

  };

  <td style="white-space:nowrap"><button class="btn sm pri" data-act="payReceipt" data-id="${p.id}">បង្កាន់ដៃ</button> ${can('pay.edit')?`<button class="btn sm" data-act="payEdit" data-id="${p.id}">កែ</button>`:voidBtn('payment',p.id)}</td></tr>`}).join('')||'<tr><td colspan="11" class="hint">មិនទាន់មានការបង់ប្រាក់</td></tr>'}</tbody></table></div>

 }};

function payForm({sid,edit}){
  const ed=edit?S.payments.find(p=>p.id===edit):null;const c=cache();
  const p=ed||{date:today(),sid:sid||'',pack:'1 ខែ',dtype:'',dval:'',dwhy:'',method:'សាច់ប្រាក់',note:'',settles:'',saleInv:''};

  const ov=modal(`<h2>${ed?'កែប្រែការបង់ប្រាក់ '+ed.id:'កត់ការបង់ប្រាក់'}</h2><div class="f">

  <label>កញ្ចប់ *<select id="pack">${opts(S.settings.packages.map(x=>x.name),p.pack)}</select></label>

  <label class="g1">ប្រភេទបញ្ចុះតម្លៃ<select id="dtype">${opts(['ភាគរយ','សាច់ប្រាក់'],p.dtype,'គ្មាន')}</select></label>
  <label class="g1">តម្លៃបញ្ចុះ (% ឬ $)<input type="number" min="0" step="any" id="dval" value="${p.dval??''}"></label>
  <label class="g1">មូលហេតុបញ្ចុះតម្លៃ<input id="dwhy" value="${esc(p.dwhy)}"></label>
  <label id="lbPaid">បានបង់ (USD) <span class="hint" id="paidHint">ទុកទទេ = បង់គ្រប់</span><input type="number" min="0" step="any" id="paid" value="${ed&&(ed.paidAmt!==ed.due||ed.pack===SETTLE)?ed.paidAmt:''}"></label>
  <label>វិធីបង់<select id="method">${opts(METHODS,p.method)}</select></label>
  <label>វិក្កយបត្រលក់ភ្ជាប់ (បើមាន)<select id="saleInv">${opts(S.sales.filter(s=>!s.sid||true).slice(-60).reverse().map(s=>({v:s.id,l:s.id+' · '+buyerName(s)+' · '+fd(s.date)})),p.saleInv,'គ្មាន')}</select></label>
  <label class="wide">ចំណាំបន្ថែម<input id="note" value="${esc(p.note)}"></label></div>
  ${ed?'':`<div id="saleSec"><h3 class="sec" style="margin:14px 0 4px">ទំនិញលក់ជាមួយ (ព្រីនក្នុងបង្កាន់ដៃតែមួយ)</h3><div class="hint" style="margin-bottom:6px">បើមានទិញឯកសណ្ឋាន សៀវភៅ សម្ភារៈ ជាមួយ សូមបន្ថែមទីនេះ។ ប្រព័ន្ធបង្កើតវិក្កយបត្រលក់ និងភ្ជាប់ឱ្យស្វ័យប្រវត្តិ។</div><div id="lines"></div><div class="bar" style="margin-top:8px;align-items:end"><button class="btn sm" type="button" id="addLine">+ បន្ថែមទំនិញ</button><label class="f" style="display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)">បានបង់ថ្លៃទំនិញ (ទទេ = គ្រប់)<input type="number" min="0" step="any" id="sPaid" style="background:var(--input);width:170px"></label></div></div>`}
  <div class="calcbox" id="calc"></div><div id="err"></div>
  <div class="mfoot">${ed?'<button class="btn bad" id="dl" style="margin-right:auto">លុប</button>':''}<button class="btn" id="c">បោះបង់</button><button class="btn pri" id="ok">រក្សាទុក និងមើលបង្កាន់ដៃ</button></div>`,{wide:true,onMount(ov){
    const upd=()=>{
      const st=getStu(ov);const settle=val(ov,'pack')===SETTLE;
      $('#lbInv',ov).hidden=!settle;for(const e of ov.querySelectorAll('.g1'))e.hidden=settle;
      $('#paidHint',ov).textContent=settle?'(ចំនួនសង *)':'ទុកទទេ = បង់គ្រប់';
      const box=$('#calc',ov);
      const sl=ov._M?ov._M.L.filter(l=>l.code):[];const sk=sl.length?saleCalc({lines:sl.map(l=>({...l})),paidAmt:val(ov,'sPaid')===''?null:+val(ov,'sPaid')}):null;
      const saleBox=sk?`<div><small>ទំនិញលក់ (ត្រូវបង់)</small><b>${money(sk.net)}</b></div><div><small>ទំនិញបានបង់</small><b>${money(sk.paid)}</b></div>`:'';
      if(!st){box.innerHTML='<small>ជ្រើសសិស្សជាមុន</small>';return}
      if(settle){
        const debts=(c.pBy.get(st.id)||[]).filter(x=>x.pack!==SETTLE&&(c.der.get(x.id).remaining>0||x.id===p.settles));
        const sel=$('#settles',ov);const keep=sel.value||p.settles;
        sel.innerHTML=opts(debts.map(x=>({v:x.id,l:`${x.id} · ${fd(x.date)} · ជំពាក់ ${money(c.der.get(x.id).remaining+(ed&&ed.settles===x.id?ed.paidAmt:0))}`})),keep,'ជ្រើសវិក្កយបត្រ');
        const o=c.pById.get(sel.value);const rem=o?round2(c.der.get(o.id).remaining+(ed&&ed.settles===o.id?ed.paidAmt:0)):0;
        const amt=+val(ov,'paid')||0;
        box.innerHTML=`<div><small>ជំពាក់វិក្កយបត្រនេះ</small><b>${money(rem)}</b></div><div><small>ចំនួនសង</small><b>${money(amt)}</b></div><div><small>ជំពាក់នៅសល់</small><b>${money(rem-amt)}</b></div>${saleBox}`;
      }else{
        const r=calcPay(st.level,val(ov,'pack'),val(ov,'dtype'),val(ov,'dval'),val(ov,'paid'));
        box.innerHTML=`<div><small>ថ្លៃ ១ ខែ (${esc(st.level)})</small><b>${money(r.fee)}</b></div><div><small>ចំនួនខែ</small><b>${r.months}</b></div><div><small>ថ្លៃមុនបញ្ចុះ</small><b>${money(r.gross)}</b></div><div><small>បញ្ចុះតម្លៃ</small><b>${money(r.disc)}</b></div><div><small>ត្រូវបង់</small><b>${money(r.due)}</b></div><div><small>បានបង់</small><b>${money(r.paidAmt)}</b></div><div><small>នៅសល់</small><b style="color:${r.due-r.paidAmt>0?'var(--bad)':'inherit'}">${money(r.due-r.paidAmt)}</b></div>${saleBox}${sk?`<div><small>សរុបបង្កាន់ដៃ (បានបង់)</small><b>${money(r.paidAmt+sk.paid)}</b></div>`:''}`;
      }
    };
    if(!ed){const M=mountLines(ov,$('#lines',ov),()=>upd());ov._M=M;$('#addLine',ov).onclick=M.add}
    ov.addEventListener('input',upd);ov.addEventListener('change',upd);upd();
  }});
  function getStu(ov){const v=val(ov,'stu').split(' ')[0];return c.byId.get(v)}
  $('#c',ov).onclick=()=>ov.close();
  if(ed)$('#dl',ov).onclick=async()=>{
    if(c.setl.get(ed.id)){$('#err',ov).innerHTML='<div class="err">មិនអាចលុបបាន៖ មានការសងបំណុលភ្ជាប់ជាមួយវិក្កយបត្រនេះ។ លុបការសងជាមុន។</div>';return}
    ov.close();ACT.voidDirect({kind:'payment',id:ed.id});
  };
  $('#ok',ov).onclick=()=>{
    const st=getStu(ov);const pack=val(ov,'pack');const settle=pack===SETTLE;let err='';
    if(!st)err='សូមជ្រើសសិស្សពីបញ្ជី';
    const r={...(ed||{}),id:ed?ed.id:nextId('payments','RC',4),date:val(ov,'date'),sid:st?st.id:'',pack,method:val(ov,'method'),note:val(ov,'note'),saleInv:val(ov,'saleInv')};
    if(!r.date)err='សូមបំពេញថ្ងៃបង់';
    if(!err){
      if(settle){
        const o=c.pById.get(val(ov,'settles'));const amt=+val(ov,'paid');
        if(!o)err='សូមជ្រើសវិក្កយបត្រដែលសង';else if(!(amt>0))err='សូមវាយចំនួនសង';
        else{const rem=round2(c.der.get(o.id).remaining+(ed&&ed.settles===o.id?ed.paidAmt:0));if(amt>rem)err='សងលើសចំនួនជំពាក់ ('+money(rem)+')'}
        Object.assign(r,{settles:val(ov,'settles'),months:0,fee:0,gross:0,disc:0,due:0,paidAmt:amt,dtype:'',dval:'',dwhy:''});
      }else{
        const x=calcPay(st?st.level:'',pack,val(ov,'dtype'),val(ov,'dval'),val(ov,'paid'));
        if(!err&&!x.fee)err='រកមិនឃើញថ្លៃសិក្សាសម្រាប់កម្រិតនេះ (មើល «ការកំណត់»)';
        if(!err&&x.paidAmt<0)err='ចំនួនបានបង់មិនត្រឹមត្រូវ';
        if(!err&&x.paidAmt>x.due)err='បានបង់ច្រើនជាងត្រូវបង់';
        Object.assign(r,x,{settles:'',dtype:val(ov,'dtype'),dval:val(ov,'dval')===''?'':+val(ov,'dval'),dwhy:val(ov,'dwhy')});
      }
    }
    if(err){$('#err',ov).innerHTML=`<div class="err">${err}</div>`;return}
    const nl=ov._M?ov._M.L.filter(l=>l.code):[];
    if(nl.length){
      if(nl.some(l=>!(+l.qty>0))){$('#err',ov).innerHTML='<div class="err">សូមបំពេញចំនួនទំនិញ</div>';return}
      const e2=stockCheck(nl);if(e2){$('#err',ov).innerHTML=`<div class="err">${e2}</div>`;return}
      const sale={id:nextId('sales','SL',4),by:ME.id,byName:ME.name,date:r.date,sid:r.sid,other:'',lines:nl.map(l=>({code:l.code,qty:+l.qty,price:l.price,dtype:l.dtype,dval:l.dval})),method:r.method,paidAmt:val(ov,'sPaid')===''?null:+val(ov,'sPaid'),note:''};
      sale.paidAmt=saleCalc(sale).paid;put('sales',sale);r.saleInv=sale.id;
    }
    if(!ed){r.receipt=nextReceipt(r.date);r.by=ME.id;r.byName=ME.name}
    delete r.sample;put('payments',r);ov.close();render();
    const sale=r.saleInv?S.sales.find(s=>s.id===r.saleInv):null;
    docModal('បង្កាន់ដៃ '+r.receipt,receiptDoc(r,sale),{land:true,name:'Receipt-'+r.receipt});
  };
}

/* ====================== item picker (Program → Category → Type → Name) ====================== */
const pk=it=>it.prog||'∅';
function bindPicker(ov,root,id,code,cb){
  const g=s=>$('#'+id+s,root);const it=code?cache().itemById.get(code):null;
  const cur={p:it?pk(it):'',c:it?it.cat:'',t:it?it.type:'',n:it?it.code:''};
  const uniq=a=>[...new Set(a)];
  const draw=()=>{
    const I=S.items;
    g('p').innerHTML=opts(uniq(I.map(pk)).map(x=>({v:x,l:x==='∅'?'ទូទៅ':x})),cur.p,'① Program');
    g('c').innerHTML=opts(uniq(I.filter(i=>pk(i)===cur.p).map(i=>i.cat)),cur.c,'② Category');
    g('t').innerHTML=opts(uniq(I.filter(i=>pk(i)===cur.p&&i.cat===cur.c).map(i=>i.type)),cur.t,'③ ប្រភេទ');
    g('n').innerHTML=opts(I.filter(i=>pk(i)===cur.p&&i.cat===cur.c&&i.type===cur.t).map(i=>({v:i.code,l:i.name+(i.unit?', '+i.unit:'')+' · ស្តុក '+num(itemStock(i).left)})),cur.n,'④ ឈ្មោះទំនិញ');
  };
  draw();
  g('p').onchange=e=>{cur.p=e.target.value;cur.c=cur.t=cur.n='';draw();cb(cur.n)};
  g('c').onchange=e=>{cur.c=e.target.value;cur.t=cur.n='';draw();cb(cur.n)};
  g('t').onchange=e=>{cur.t=e.target.value;cur.n='';draw();cb(cur.n)};
  g('n').onchange=e=>{cur.n=e.target.value;cb(cur.n)};
}
const pickerHtml=id=>`<select id="${id}p"></select><select id="${id}c"></select><select id="${id}t"></select><select id="${id}n"></select>`;

/* shared sale-line editor (used by sales form and payment form) */
function mountLines(ov,box,onChange){
  const L=[];const blank=()=>({code:'',qty:1,price:0,dtype:'',dval:''});
  const prices=()=>L.forEach((l,i)=>{const e=$('#ln'+i,box);if(e){const it=cache().itemById.get(l.code);e.textContent=it?`${money(it.price)} × ${l.qty||0} = ${money((l.qty||0)*it.price)}`:''}});
  const draw=()=>{
    box.innerHTML=L.map((l,i)=>`<div class="card" style="padding:10px;margin-bottom:8px"><div class="f" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${pickerHtml('i'+i)}</div>
    <div class="f" style="margin-top:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));align-items:end"><label>ចំនួន<input type="number" min="1" step="1" data-i="${i}" data-k="qty" value="${l.qty}"></label>
    <label>បញ្ចុះ<select data-i="${i}" data-k="dtype">${opts(['ភាគរយ','សាច់ប្រាក់'],l.dtype,'គ្មាន')}</select></label><label>តម្លៃបញ្ចុះ<input type="number" min="0" step="any" data-i="${i}" data-k="dval" value="${l.dval}"></label><span class="hint" id="ln${i}"></span><button class="btn sm bad" type="button" data-i="${i}" data-k="rm">លុប</button></div></div>`).join('');
    L.forEach((l,i)=>bindPicker(ov,box,'i'+i,l.code,code=>{l.code=code;const it=cache().itemById.get(code);l.price=it?it.price:0;prices();onChange()}));prices();onChange();
  };
  box.addEventListener('input',e=>{const t=e.target;if(t.dataset.k&&t.dataset.k!=='rm'){L[t.dataset.i][t.dataset.k]=t.dataset.k==='qty'||t.dataset.k==='dval'?(t.value===''?'':+t.value):t.value;prices();onChange()}});
  box.addEventListener('click',e=>{const t=e.target;if(t.dataset.k==='rm'){L.splice(+t.dataset.i,1);draw()}});
  return{L,start(){L.push(blank());draw()},add(){L.push(blank());draw()},clear(){L.length=0;draw()}};
}
function stockCheck(lines){
  const need={};for(const l of lines)need[l.code]=(need[l.code]||0)+ +l.qty;
  for(const code in need){const it=cache().itemById.get(code),k=itemStock(it);if(need[code]>k.left)return`ស្តុកមិនគ្រប់៖ ${it.name} (នៅសល់ ${num(k.left)})`}
  return'';
}
ACT.saleNew=()=>{
  const ov=modal(`<h2>វិក្កយបត្រលក់ថ្មី</h2><div class="f">
  <label>ថ្ងៃលក់<input type="date" id="date" value="${today()}"></label>
  <label>សិស្ស (វាយឈ្មោះ ឬលេខ)<input id="stu" list="stl2" autocomplete="off"><datalist id="stl2">${S.students.map(s=>`<option value="${esc(s.id+' · '+s.name)}">`).join('')}</datalist></label>
  <label>អ្នកទិញផ្សេង (មិនមែនសិស្ស)<input id="other"></label>
  <label>វិធីបង់<select id="method">${opts(METHODS,'សាច់ប្រាក់')}</select></label>
  <label>បានបង់ (USD) <span class="hint">ទទេ = បង់គ្រប់</span><input type="number" min="0" step="any" id="paid"></label>
  <label>ចំណាំ<input id="note"></label></div>
  <h3 class="sec">ទំនិញ</h3><div id="lines"></div><button class="btn sm" id="add" style="margin-top:8px">+ បន្ថែមទំនិញ</button>
  <div class="calcbox" id="calc"></div><div id="err"></div>
  <div class="mfoot"><button class="btn" id="c">បោះបង់</button><button class="btn pri" id="ok">រក្សាទុក និងមើលវិក្កយបត្រ</button></div>`,{wide:true});
  const box=$('#lines',ov);
  const M=mountLines(ov,box,()=>totals());const L=M.L;
  const totals=()=>{const k=saleCalc({lines:L.filter(l=>l.code).map(l=>({...l})),paidAmt:val(ov,'paid')===''?null:+val(ov,'paid')});$('#calc',ov).innerHTML=`<div><small>ថ្លៃមុនបញ្ចុះ</small><b>${money(k.gross)}</b></div><div><small>បញ្ចុះ</small><b>${money(k.disc)}</b></div><div><small>ត្រូវបង់</small><b>${money(k.net)}</b></div><div><small>បានបង់</small><b>${money(k.paid)}</b></div><div><small>នៅសល់</small><b>${money(k.left)}</b></div>`};
  M.start();$('#add',ov).onclick=M.add;
  ov.addEventListener('input',e=>{if(e.target.id==='paid')totals()});
  $('#c',ov).onclick=()=>ov.close();
  $('#ok',ov).onclick=()=>{
    const sid=val(ov,'stu').split(' ')[0];const st=cache().byId.get(sid);const other=clean(val(ov,'other'));
    const lines=L.filter(l=>l.code);const need={};let err='';
    if(!st&&!other)err='សូមជ្រើសសិស្ស ឬវាយឈ្មោះអ្នកទិញ';
    else if(!lines.length)err='សូមជ្រើសទំនិញយ៉ាងហោចណាស់ ១ មុខ';
    else if(lines.some(l=>!(+l.qty>0)))err='សូមបំពេញចំនួនទំនិញ';
    if(!err)err=stockCheck(lines);
    if(err){$('#err',ov).innerHTML=`<div class="err">${err}</div>`;return}
    const sale={id:nextId('sales','SL',4),by:ME.id,byName:ME.name,date:val(ov,'date'),sid:st?st.id:'',other:st?'':other,lines:lines.map(l=>({code:l.code,qty:+l.qty,price:l.price,dtype:l.dtype,dval:l.dval})),method:val(ov,'method'),paidAmt:val(ov,'paid')===''?null:+val(ov,'paid'),note:val(ov,'note')};
    sale.paidAmt=saleCalc(sale).paid;
    put('sales',sale);ov.close();render();docModal('វិក្កយបត្រលក់ '+sale.id,receiptDoc(null,sale),{land:true,name:'Invoice-'+sale.id});
  };
};

document.addEventListener('change',e=>{
  if((e.target.id==='logo'||e.target.id==='restore')&&!can('admin'))return;
  if(e.target.id==='logo'){const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.settings.logo=cv.toDataURL('image/png');putSettings();render();toast('បានដាក់ឡូហ្គោ')};im.src=fr.result};fr.readAsDataURL(f)}
  if(e.target.id==='restore'){const f=e.target.files[0];if(!f)return;f.text().then(async t=>{try{const d=JSON.parse(t);if(!d.settings||!d.students)throw 0;if(!await ask('ស្តារពី Backup? ទិន្នន័យបច្ចុប្បន្ននឹងត្រូវជំនួស។','ស្តារ'))return;await wipeAll();S=d;bump();await writeAll();render();toast('បានស្តារ')}catch(x){toast('ឯកសារ Backup មិនត្រឹមត្រូវ')}})}
});
async function writeAll(){
  if(STORE==='db'){const ops=[];for(const c of COLLS)for(const r of S[c])ops.push(()=>DB.collection(c).doc(r.id).set(r));ops.push(()=>DB.doc('meta/settings').set({v:S.settings}));for(let i=0;i<ops.length;i+=10)await Promise.all(ops.slice(i,i+10).map(f=>f()))}else lsSave();

PG.guide={title:'ណែនាំប្រើប្រាស់',html(){return `<div class="card" style="max-width:820px"><h3 style="margin-bottom:8px">ជំហានប្រចាំថ្ងៃ</h3><ol style="padding-left:20px;margin:0;display:grid;gap:6px">
 <li><b>ព្រឹក៖</b> មើល «សង្ខេប» ដើម្បីឃើញសិស្សនៅជំពាក់ សិស្សត្រូវបន្តបង់ និងទំនិញជិតអស់។</li>
 <li><b>សិស្សថ្មី៖</b> «សិស្ស» → ចុះឈ្មោះ → ចុច «បង់» → ទទួលបង្កាន់ដៃ (ទាញយក PDF ឬ HTML ដើម្បីព្រីន A5)។</li>
 <li><b>បង់មិនគ្រប់៖</b> វាយចំនួនក្នុងប្រអប់ «បានបង់»។ ពេលសិស្សមកសង ជ្រើសកញ្ចប់ «សង» រួចជ្រើសវិក្កយបត្រដែលជំពាក់។</li>
 <li><b>លក់ឯកសណ្ឋាន/សៀវភៅ៖</b> «ការលក់» → វិក្កយបត្រលក់ថ្មី → ជ្រើសទំនិញ ① → ④។ ស្តុកថយស្វ័យប្រវត្តិ។</li>
 <li><b>ទំនិញមកដល់៖</b> «ចលនាស្តុក» → ទិញចូល (Stock In)។ បាត់ ឬខូច ជ្រើសប្រភេទ «បាត់» ឬ «ខូច»។</li>
 <li><b>ល្ងាច៖</b> «របាយការណ៍» → ប្រចាំថ្ងៃ → ទាញយក A5 ដើម្បីផ្ទៀងលុយ។</li>
 <li><b>សិស្សឈប់រៀន៖</b> កែប្រែសិស្ស → ស្ថានភាព «ឈប់រៀន» + ថ្ងៃ និងមូលហេតុ។</li>
 <li><b>រូបថត និងប័ណ្ណ ID៖</b> «សិស្ស» → មើល → ដាក់រូបថត → ប័ណ្ណសិស្ស។</li></ol>
 <h3 style="margin:16px 0 8px">ចំណាំ</h3><ul style="padding-left:20px;margin:0;display:grid;gap:6px"><li>លេខសម្គាល់សិស្ស បង្កាន់ដៃ (000001… ចាប់ផ្តើមឡើងវិញរៀងរាល់ ១ មករា) និងលេខវិក្កយបត្រ ចេញដោយស្វ័យប្រវត្តិ ហើយមិនប្តូរឡើយ។</li>
 <li>ទាញយក Backup ក្នុង «ការកំណត់» ជាប្រចាំ។</li><li>ថ្លៃសិក្សា ១ ខែ គិតសម្រាប់ ១ វេន ។ កែនៅ «ការកំណត់»។</li></ul></div>`}};

/* ====================== scores ====================== */
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)};
const scoreId=(sid,yr,ex,sub)=>sid+'_'+hash(yr+'|'+ex+'|'+sub);
V.sc={k:'',exam:'',subj:''};V.rs={k:'',exam:''};
const subjectsOf=prog=>S.settings.subjects.filter(x=>x.prog===prog);
const gradeOf=a=>a>=90?'A':a>=80?'B':a>=70?'C':a>=60?'D':a>=50?'E':'F';
function classResults(k,exam){
  const subs=subjectsOf(k.prog);const yr=S.settings.year;
  const sc=new Map(S.scores.filter(x=>x.year===yr&&x.exam===exam).map(x=>[x.sid+'|'+x.subject,x.score]));
  const rows=classMatch(k).filter(s=>s.status!=='ឈប់រៀន').sort(byName).map(s=>{
    const vals=subs.map(b=>sc.has(s.id+'|'+b.name)?sc.get(s.id+'|'+b.name):null);
    const entered=vals.filter(v=>v!==null);const complete=subs.length>0&&entered.length===subs.length;
    const total=round2(entered.reduce((t,v)=>t+v,0)),mx=subs.reduce((t,b)=>t+b.max,0);
    const avg=complete?round2(total/mx*100):null;
    return{s,vals,total,complete,avg,grade:avg==null?'':gradeOf(avg),rank:null};
  });
  const done=rows.filter(r=>r.complete).sort((a,b)=>b.avg-a.avg);
  done.forEach((r,i)=>{r.rank=i&&done[i-1].avg===r.avg?done[i-1].rank:i+1});
  return{subs,rows,done};
}

  ${rows.map(({ex,r,N})=>`<tr><td>${esc(ex)}</td>${r.vals.map(x=>`<td class="r">${x==null?'':num(x)}</td>`).join('')}<td class="r">${num(r.total)}</td><td class="r">${r.avg==null?'':r.avg.toFixed(2)}</td><td>${r.rank?r.rank+' / '+N+(r.rank<=top?' ★':''):'—'}</td><td>${r.grade}</td></tr>`).join('')||`<tr><td colspan="${subs.length+5}">មិនទាន់មានពិន្ទុ</td></tr>`}</tbody></table>

/* ====================== people report (students / teachers / classes) ====================== */
function peopleDoc(){
  const studs=scopeStudents(),act=studs.filter(s=>s.status!=='ឈប់រៀន');
  const cnt=(arr,f)=>{const m={};for(const x of arr){const k=f(x)||'—';m[k]=(m[k]||0)+1}return Object.entries(m)};
  const row=(a,b)=>`<tr><td>${esc(a)}</td><td class="r">${b}</td></tr>`;
  return `<div class="doc port">${schoolHead('របាយការណ៍សិស្ស គ្រូ និងថ្នាក់','PEOPLE REPORT','')}<div class="sub">${ME.prog?esc(ME.prog)+' · ':''}${fd(today())}</div>
  <h4>១. សិស្ស</h4><table>${row('សិស្សសរុប',studs.length)}${row('កំពុងរៀន',act.length)}${row('ឈប់រៀន',studs.length-act.length)}${row('ប្រុស / ស្រី (កំពុងរៀន)',act.filter(s=>s.sex==='ប្រុស').length+' / '+act.filter(s=>s.sex==='ស្រី').length)}</table>
  <h4>២. សិស្សកំពុងរៀន តាមកម្មវិធី</h4><table>${cnt(act,s=>s.prog).map(([a,b])=>row(a,b)).join('')}</table>
  <h4>៣. តាមកម្រិត / ថ្នាក់</h4><table>${cnt(act,s=>s.level).map(([a,b])=>row(a,b)).join('')}</table>
  <h4>៤. តាមវេន</h4><table>${cnt(act,s=>s.shift).map(([a,b])=>row(a,b)).join('')}</table>
  <h4>៥. គ្រូបង្រៀន</h4><table><tr><th>ឈ្មោះ</th><th>តួនាទី</th><th>ស្ថានភាព</th><th class="r">ថ្នាក់</th><th class="r">សិស្ស</th></tr>${scopeTeachers().map(t=>{const cl=S.classes.filter(k=>k.teacher===t.name);return`<tr><td>${esc(t.name)}</td><td>${esc(t.role)}</td><td>${esc(t.status)}</td><td class="r">${cl.length}</td><td class="r">${sum(cl,k=>classStats(k).active)}</td></tr>`}).join('')||'<tr><td colspan="5">គ្មាន</td></tr>'}</table>
  <h4>៦. ថ្នាក់រៀន</h4><table><tr><th>ថ្នាក់</th><th>គ្រូ</th><th class="r">សមត្ថភាព</th><th class="r">សិស្ស</th><th class="r">ទំនេរ</th></tr>${scopeClasses().map(k=>{const s=classStats(k);return`<tr><td>${esc(k.level||'ទាំងអស់')} · ${esc(k.shift)} · ${esc(k.room)}</td><td>${esc(k.teacher)}</td><td class="r">${k.cap||''}</td><td class="r">${s.active}</td><td class="r">${k.cap?k.cap-s.active:''}</td></tr>`}).join('')||'<tr><td colspan="5">គ្មាន</td></tr>'}</table>
  <div class="rc-sign"><span></span><span>Printed: ${fd(today())}</span></div></div>`;
}

function settingsExtra(){
  return `<div class="top" style="margin-top:20px"><h3 class="sec" style="flex:1;margin:0">មុខវិជ្ជា និងពិន្ទុពេញ</h3><button class="btn pri" data-act="subNew">+ មុខវិជ្ជា</button></div>
  <div class="tbl"><table><thead><tr><th>កម្មវិធី</th><th>មុខវិជ្ជា</th><th class="r">ពិន្ទុពេញ</th><th></th></tr></thead><tbody>${S.settings.subjects.map((b,i)=>`<tr><td>${esc(b.prog)}</td><td>${esc(b.name)}</td><td class="r">${b.max}</td><td><button class="btn sm" data-act="subEdit" data-i="${i}">កែ</button></td></tr>`).join('')}</tbody></table></div>

  ${STORE==='db'?`<div class="note" style="margin-bottom:8px">១) ចុច <b>Share</b> របស់ទំព័រនេះ ហើយអញ្ជើញបុគ្គលិកដោយគណនី Claude ជាមួយសិទ្ធិ <b>Contributor</b> (ចាំបាច់ដើម្បីកត់ទិន្នន័យ)។ ២) បន្ទាប់មកបន្ថែមគេនៅទីនេះ ហើយកំណត់តួនាទី។ អ្នកដែលមិនទាន់កំណត់តួនាទី នឹងមិនឃើញទិន្នន័យទេ។ ម្ចាស់ទំព័រជា Admin ជានិច្ច។</div><div class="tbl"><table><thead><tr><th>ឈ្មោះ</th><th>តួនាទី</th><th>គ្រូ / កម្មវិធី</th><th></th></tr></thead><tbody id="usersBody"><tr><td colspan="4" class="hint">កំពុងផ្ទុក…</td></tr></tbody></table></div>`:'<p class="hint">មុខងារអ្នកប្រើ ប្រើបានតែពេលដំណើរការក្នុង Claude ជាមួយមូលដ្ឋានទិន្នន័យចែករំលែក។</p>'}`;
}
async function fillUsers(){
  const body=$('#usersBody');if(!body)return;
  const ids=Object.keys(ROLES.assign);let prof={};
  try{const u=await window.claude.use('user');if(u&&ids.length)prof=await u.profiles(ids)}catch(e){}
  if(!$('#usersBody'))return;
  $('#usersBody').innerHTML=ids.map(id=>{const a=ROLES.assign[id],t=S.teachers.find(x=>x.id===a.teacherId);return`<tr><td>${esc((prof[id]&&prof[id].name)||id)}</td><td>${esc(ROLE_NAMES[a.role])}</td><td>${esc(t?t.name:'')} ${esc(a.prog||'')}</td><td style="white-space:nowrap"><button class="btn sm" data-act="userEdit" data-id="${esc(id)}">កែ</button> <button class="btn sm bad" data-act="userDel" data-id="${esc(id)}">ដក</button></td></tr>`}).join('')||'<tr><td colspan="4" class="hint">មិនទាន់មាន។ ចុច «+ បន្ថែមអ្នកប្រើ»។</td></tr>';
}
ACT.userAdd=()=>userForm();ACT.userEdit=d=>userForm(d.id);
ACT.userDel=async d=>{if(await ask('ដកសិទ្ធិអ្នកប្រើនេះ?','ដក')){delete ROLES.assign[d.id];saveRoles();fillUsers();toast('បានដក')}};
async function userForm(id){
  const a=id?ROLES.assign[id]:{role:'clerk',teacherId:'',prog:''};let chosen=id||'';let chosenName='';
  if(id){try{const u=await window.claude.use('user');const p=await u.profiles([id]);chosenName=(p[id]&&p[id].name)||id}catch(e){chosenName=id}}
  const ov=modal(`<h2>${id?'កែសិទ្ធិអ្នកប្រើ':'បន្ថែមអ្នកប្រើ'}</h2><div class="f">
  <label class="wide">អ្នកប្រើ<input id="sq" placeholder="វាយឈ្មោះដើម្បីស្វែងរក" value="${esc(chosenName)}" ${id?'readonly':''} autocomplete="off"></label><div class="wide" id="hits"></div>
  <label>តួនាទី<select id="role">${opts(ALLR.map(r=>({v:r,l:ROLE_NAMES[r]})),a.role)}</select></label>
  <label id="lbT">គ្រូ (សម្រាប់តួនាទីគ្រូបង្រៀន)<select id="tid">${opts(S.teachers.map(t=>({v:t.id,l:t.id+' · '+t.name})),a.teacherId,'—')}</select></label>
  <label id="lbP">កម្មវិធី (សម្រាប់ប្រធានកម្មវិធី)<select id="prog">${opts(S.settings.programs.map(p=>p.kh),a.prog,'ទាំងអស់')}</select></label></div>
  <div id="err"></div><div class="mfoot"><button class="btn" id="c">បោះបង់</button><button class="btn pri" id="ok">រក្សាទុក</button></div>`,{wide:true,onMount(ov){
    const upd=()=>{$('#lbT',ov).hidden=val(ov,'role')!=='teacher';$('#lbP',ov).hidden=val(ov,'role')!=='head'};upd();$('#role',ov).onchange=upd;
    if(!id){let tm;$('#sq',ov).oninput=e=>{clearTimeout(tm);tm=setTimeout(async()=>{try{const u=await window.claude.use('user');const r=await u.search(e.target.value);$('#hits',ov).innerHTML=r.filter(x=>!x.isMe).map(x=>`<button class="btn sm" type="button" data-uid="${esc(x.id)}" style="margin:2px">${esc(x.name||x.id)}</button>`).join('')||'<span class="hint">រកមិនឃើញ</span>'}catch(x){$('#hits',ov).innerHTML='<span class="hint">ស្វែងរកមិនបាន</span>'}},250)};
      $('#hits',ov).onclick=e=>{const b=e.target.closest('[data-uid]');if(b){chosen=b.dataset.uid;$('#sq',ov).value=b.textContent;$('#hits',ov).innerHTML=`<span class="pill good">ជ្រើសរួច៖ ${esc(b.textContent)}</span>`}};}
  }});
  $('#c',ov).onclick=()=>ov.close();
  $('#ok',ov).onclick=()=>{const role=val(ov,'role');const err=!chosen?'សូមជ្រើសអ្នកប្រើពីលទ្ធផលស្វែងរក':role==='teacher'&&!val(ov,'tid')?'សូមជ្រើសគ្រូ':'';if(err){$('#err',ov).innerHTML=`<div class="err">${err}</div>`;return}
    ROLES.assign[chosen]={role,teacherId:role==='teacher'?val(ov,'tid'):'',prog:role==='head'?val(ov,'prog'):''};saveRoles();ov.close();fillUsers();toast('បានរក្សាទុក')};
}
ACT.subNew=()=>subForm();ACT.subEdit=d=>subForm(+d.i);
function subForm(i){
  const ed=i!=null?S.settings.subjects[i]:null;const b=ed||{prog:S.settings.programs[0].kh,name:'',max:100};
  const ov=modal(`<h2>${ed?'កែមុខវិជ្ជា':'មុខវិជ្ជាថ្មី'}</h2><div class="f"><label>កម្មវិធី<select id="prog">${opts(S.settings.programs.map(p=>p.kh),b.prog)}</select></label><label>មុខវិជ្ជា *<input id="name" value="${esc(b.name)}"></label><label>ពិន្ទុពេញ<input type="number" min="1" id="max" value="${b.max}"></label></div><div id="err"></div>
  <div class="mfoot">${ed?'<button class="btn bad" id="dl" style="margin-right:auto">លុប</button>':''}<button class="btn" id="c">បោះបង់</button><button class="btn pri" id="ok">រក្សាទុក</button></div>`);
  $('#c',ov).onclick=()=>ov.close();
  if(ed)$('#dl',ov).onclick=()=>{S.settings.subjects.splice(i,1);putSettings();ov.close();render()};
  $('#ok',ov).onclick=()=>{const r={prog:val(ov,'prog'),name:clean(val(ov,'name')),max:+val(ov,'max')||100};if(!r.name){$('#err',ov).innerHTML='<div class="err">សូមបំពេញឈ្មោះមុខវិជ្ជា</div>';return}
    if(ed)S.settings.subjects[i]=r;else S.settings.subjects.push(r);putSettings();ov.close();render()};
}

/* ====================== boot ====================== */
function start(){
  $('#boot').hidden=true;$('#app').hidden=false;
  if(!pageOk(curPage())||!location.hash)location.hash='#'+homePage();
  render();
}
function msgBoot(h,p){$('#boot').className='welcome card';$('#boot').innerHTML=`<h1>${h}</h1><p class="hint" style="font-size:14px">${p}</p>`}
(async()=>{
  const ok=await initStore();
  await resolveMe();
  if(ok){
    if(ME.role==='none'){msgBoot('អ្នកមិនទាន់មានសិទ្ធិចូលប្រើ','សូមទាក់ទងអ្នកគ្រប់គ្រងសាលា ដើម្បីកំណត់តួនាទីរបស់អ្នក។');return}
    start();return;
  }
  if(STORE==='db'&&ME.role!=='admin'){msgBoot('ប្រព័ន្ធមិនទាន់រៀបចំ','សូមឱ្យអ្នកគ្រប់គ្រង (ម្ចាស់ទំព័រ) បើកទំព័រនេះជាមុនសិន។');return}
  $('#boot').className='welcome card';
  $('#boot').innerHTML=`<h1>ស្វាគមន៍ មកកាន់ប្រព័ន្ធគ្រប់គ្រងសាលា</h1><p class="hint" style="font-size:14px">នាំចូលថ្លៃសិក្សា កម្មវិធី និងបញ្ជីទំនិញ ${SEED.items.length} មុខ ពីឯកសារ Excel របស់អ្នក។</p>
  <div class="bar" style="justify-content:center"><button class="btn pri" id="go1">ចាប់ផ្តើម (មានទិន្នន័យគំរូ ៣ សិស្ស)</button><button class="btn" id="go2">ចាប់ផ្តើមទទេ (គ្មានសិស្ស)</button></div><p class="hint">ទិន្នន័យនឹងរក្សាទុក${STORE==='db'?'ក្នុងប្រព័ន្ធ (ចែករំលែក ជាប់រហូត)':'ក្នុង browser នេះ'}។</p>`;
  const go=async clear=>{$('#boot').innerHTML='<h1>កំពុងរៀបចំទិន្នន័យ…</h1>';await seedAll();if(clear){for(const c of ['students','payments','sales','teachers','classes'])for(const r of [...S[c]])del(c,r.id)}start()};
  $('#go1').onclick=()=>go(false);$('#go2').onclick=()=>go(true);
})();
</script>
